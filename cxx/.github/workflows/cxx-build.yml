name: C++ Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'cxx/**'
      - '.github/workflows/cxx-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cxx/**'
      - '.github/workflows/cxx-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -S cxx -B cxx/build
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build cxx/build --config ${{ matrix.config }} --parallel

      - name: Test
        working-directory: cxx/build
        run: ctest -C ${{ matrix.config }} --output-on-failure --parallel
